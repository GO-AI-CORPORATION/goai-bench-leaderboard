[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = ["E501"] # line too long (black is taking care of this)
line-length = 119
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119

[tool.poetry]
name = "leaderboard"
version = "0.1.0"
description = ""
authors = ["María Grandury <mariagrandury@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
accelerate = "0.26.0"
APScheduler = "3.10.1"
black = "23.11.0"
click = "8.1.3"
datasets = "2.16"
gradio = "4.4.0"
gradio_client = "0.7.0"
huggingface-hub = "0.19.4"
isort = "5.13.2"
matplotlib = "3.7.1"
numpy = "1.24.2"
pandas = "2.0.0"
pre-commit = "3.7.1"
python-dateutil = "2.8.2"
requests = "2.28.2"
sentencepiece = "*"
tabulate = "0.9.0"
tokenizers = "0.15.0"
tqdm = "4.65.0"
transformers = "4.35.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
